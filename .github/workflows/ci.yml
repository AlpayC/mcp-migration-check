name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The skill and the npm package each ship a generated copy of the engine.
      # It has drifted before — a stale bundle means a shipped artifact and the
      # web demo disagree about the rules while both look fine in isolation.
      # Rebuild both and fail if either moved.
      - name: Engine bundles are in sync with packages/core
        run: |
          npm run build:bundles
          if ! git diff --exit-code -- skill/mcp-migration/scripts/mcpcheck.mjs packages/cli/bin/mcpcheck.mjs; then
            echo "::error::A generated engine bundle is stale. Run 'npm run build:bundles' and commit the result."
            exit 1
          fi

      # Four places quote the ecosystem figures — the site and both READMEs are
      # generated from reports/summary.json, and they had drifted before: the
      # landing page spent weeks claiming 13,350 endpoints against the report's
      # 13,380. The 16 MB run that produces the summary is gitignored, so this
      # cannot check the extraction — but it can prove every surface still
      # matches the summary that is committed.
      - name: Ecosystem figures are in sync with reports/summary.json
        run: |
          npm run build:ecosystem-snapshot
          if ! git diff --exit-code -- web/lib/ecosystem-snapshot.ts README.md packages/cli/README.md; then
            echo "::error::A surface quoting the ecosystem figures is stale. Run 'npm run build:ecosystem-snapshot' and commit the result."
            exit 1
          fi

      # End-to-end over the bundled script: the unit tests never touch the
      # filesystem, so this is the only thing covering scan.ts and the CLI
      # wiring. Asserts the exact rule ids, not just a non-zero exit.
      - name: Fixtures produce the expected findings
        run: |
          set +e
          acme=$(node skill/mcp-migration/scripts/mcpcheck.mjs \
            --source skill/mcp-migration-workspace/fixtures/acme-search-mcp --json)
          acme_code=$?
          notes=$(node skill/mcp-migration/scripts/mcpcheck.mjs \
            --source skill/mcp-migration-workspace/fixtures/notes-mcp --json)
          notes_code=$?
          python_v1=$(node skill/mcp-migration/scripts/mcpcheck.mjs \
            --source skill/mcp-migration-workspace/fixtures/python-v1-mcp --json)
          python_v1_code=$?
          python_v2=$(node skill/mcp-migration/scripts/mcpcheck.mjs \
            --source skill/mcp-migration-workspace/fixtures/python-v2-mcp --json)
          python_v2_code=$?
          set -e

          [ "$acme_code" = "1" ]  || { echo "acme: expected exit 1, got $acme_code"; exit 1; }
          [ "$notes_code" = "1" ] || { echo "notes: expected exit 1, got $notes_code"; exit 1; }
          [ "$python_v1_code" = "1" ] || { echo "python v1: expected exit 1, got $python_v1_code"; exit 1; }
          [ "$python_v2_code" = "0" ] || { echo "python v2: expected exit 0, got $python_v2_code"; exit 1; }

          echo "$acme"  | jq -e '[.findings[].ruleId] == ["MCP001","MCP002","MCP003","MCP005","MCP007"]' > /dev/null
          echo "$acme"  | jq -e '.grade.letter == "F"' > /dev/null

          # notes-mcp is the triage fixture: MCP002 is a false positive
          # (express-session, not MCP state) and MCP007 is real.
          echo "$notes" | jq -e '[.findings[].ruleId] == ["MCP002","MCP007"]' > /dev/null
          echo "$notes" | jq -e '.grade.letter == "D"' > /dev/null

          echo "$python_v1" | jq -e '[.findings[].ruleId] == ["MCP001","MCP003","MCP004","MCP005","MCP009"]' > /dev/null
          echo "$python_v1" | jq -e '.grade.letter == "F"' > /dev/null

          echo "$python_v2" | jq -e '.findings == []' > /dev/null
          echo "$python_v2" | jq -e '.grade.letter == "A"' > /dev/null

          echo "fixtures ok"

  action:
    name: github action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The action is the surface other repositories consume, and it is the one
      # part of this project that no unit test reaches: composite `run:` blocks
      # only ever execute on a runner. So run it here, against a fixture whose
      # findings are already pinned by the engine job.
      - name: Scan a fixture
        id: scan
        uses: ./
        with:
          source: skill/mcp-migration-workspace/fixtures/acme-search-mcp
          fail-on: never

      - name: Outputs match the fixture
        env:
          GRADE: ${{ steps.scan.outputs.grade }}
          SCORE: ${{ steps.scan.outputs.score }}
          CRITICAL: ${{ steps.scan.outputs.critical }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          BADGE: ${{ steps.scan.outputs.badge-url }}
          REPORT: ${{ steps.scan.outputs.report-path }}
        run: |
          [ "$GRADE" = "F" ]    || { echo "grade: expected F, got $GRADE"; exit 1; }
          [ "$SCORE" = "0" ]    || { echo "score: expected 0, got $SCORE"; exit 1; }
          [ "$CRITICAL" = "2" ] || { echo "critical: expected 2, got $CRITICAL"; exit 1; }
          [ "$FINDINGS" = "5" ] || { echo "findings: expected 5, got $FINDINGS"; exit 1; }
          case "$BADGE" in https://img.shields.io/badge/*) ;; *) echo "badge: $BADGE"; exit 1;; esac
          jq -e '.grade.letter == "F"' "$REPORT" > /dev/null

      - name: Scan a Python v2 fixture through the action
        id: python
        uses: ./
        with:
          source: skill/mcp-migration-workspace/fixtures/python-v2-mcp
          fail-on: never
          report-path: python-report.json

      - name: Python action outputs are clean
        env:
          GRADE: ${{ steps.python.outputs.grade }}
          SCORE: ${{ steps.python.outputs.score }}
          FINDINGS: ${{ steps.python.outputs.findings }}
          REPORT: ${{ steps.python.outputs.report-path }}
        run: |
          [ "$GRADE" = "A" ]    || { echo "grade: expected A, got $GRADE"; exit 1; }
          [ "$SCORE" = "100" ] || { echo "score: expected 100, got $SCORE"; exit 1; }
          [ "$FINDINGS" = "0" ] || { echo "findings: expected 0, got $FINDINGS"; exit 1; }
          jq -e '.findings == []' "$REPORT" > /dev/null

      # `fail-on` is the whole point of putting this in a pipeline. If it does
      # not redden a run, everyone gets a green check over a broken server.
      - name: fail-on critical actually fails
        id: gate
        continue-on-error: true
        uses: ./
        with:
          source: skill/mcp-migration-workspace/fixtures/acme-search-mcp
          fail-on: critical
          report-path: gate-report.json

      - name: The gate reported failure
        run: |
          [ "${{ steps.gate.outcome }}" = "failure" ] \
            || { echo "expected the gated step to fail, got ${{ steps.gate.outcome }}"; exit 1; }

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck -w web

      - name: Build
        run: npm run build -w web
