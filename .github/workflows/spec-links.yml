name: Spec links

on:
  schedule:
    # Weekly. The rules cite pages on somebody else's site; a citation can stop
    # being true without anything in this repository changing.
    - cron: "13 6 * * 2"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/core/src/rules.ts"
      - "scripts/verify-spec-links.mjs"
      - ".github/workflows/spec-links.yml"

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: citations still say what the rules claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fetches every specRef and looks for a phrase that only appears on the
      # page it should be. A status check is not enough and this repo has the
      # proof: the original refs used fragments, returned 200, and served the
      # overview page. All seven were wrong and every link checker was happy.
      - name: Verify
        id: verify
        run: node --import tsx scripts/verify-spec-links.mjs

      # A citation going stale is not a broken build — nothing in the repository
      # changed. It is a thing somebody has to go read. So it opens an issue on
      # the scheduled run rather than only reddening a run nobody is watching.
      - name: Open an issue if a citation went stale
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "A spec citation no longer verifies";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "spec-drift",
            });
            if (existing.data.some((i) => i.title === title)) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["spec-drift"],
              body: [
                "The scheduled spec-link check failed. One or more `specRef` URLs",
                "returned a page that no longer contains the phrase the rule is",
                "citing it for — moved, rewritten, or silently redirected.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Read the page, fix the ref or the marker in",
                "`scripts/verify-spec-links.mjs`, and update the date in",
                "`SPEC_VERIFIED_AT` — the report quotes it, so it should mean",
                "something.",
              ].join("\n"),
            });
