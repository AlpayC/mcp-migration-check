name: Release

on:
  push:
    # Version tags only — `v*` would also catch `v1`, the moving pointer the
    # GitHub Action is consumed through, and cut a release for every move of it.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the artifact for"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and attach the skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The npm package takes its version from this tag, so it cannot disagree
      # with it. The plugin manifest is the exception: it is read straight out
      # of the repository by everyone who installs the skill, so its version has
      # to be committed and is therefore the one number here maintained by hand.
      # Checked before anything is built — a mismatch found after the artifact
      # is attached is a release that has to be redone.
      - name: The plugin manifest agrees with the tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          manifest=skill/.claude-plugin/plugin.json
          declared=$(node -p "require('./$manifest').version ?? ''")
          expected="${TAG#v}"
          if [ "$declared" != "$expected" ]; then
            echo "::error file=$manifest::plugin.json says \"$declared\", tag says \"$expected\". Bump the version in $manifest, commit it, and move the tag."
            exit 1
          fi
          echo "plugin.json and $TAG agree on $expected"

      # A release is the one artifact strangers actually download, so it does
      # not get built from an unverified tree.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack the skill
        run: npm run pack:skill

      # pack-skill.mjs already checks the magic bytes. This checks the shape:
      # a .skill Claude can install has SKILL.md under a single top folder, and
      # entry names must use forward slashes.
      - name: Verify the archive
        run: |
          unzip -l dist/mcp-migration.skill
          unzip -l dist/mcp-migration.skill | grep -q "mcp-migration/SKILL.md" \
            || { echo "::error::SKILL.md missing from the archive"; exit 1; }
          if unzip -l dist/mcp-migration.skill | grep -q '\\'; then
            echo "::error::archive contains backslash entry names"
            exit 1
          fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/mcp-migration.skill --clobber
          else
            gh release create "$TAG" dist/mcp-migration.skill \
              --title "$TAG" \
              --generate-notes
          fi
