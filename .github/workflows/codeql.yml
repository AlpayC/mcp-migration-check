name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a rule added upstream after the last commit still gets applied
    # to code that is no longer changing.
    - cron: "27 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze javascript-typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended adds the lower-severity rules. The point of
          # scanning a project whose core is an SSRF guard is to hear about the
          # near misses, not only the certainties.
          queries: security-extended
          config: |
            paths-ignore:
              # Generated from packages/core — findings here are duplicates of
              # the source they were bundled from, reported at a line number
              # that does not exist in any file anyone edits.
              - skill/mcp-migration/scripts/mcpcheck.mjs
              # Deliberately imperfect test material. notes-mcp carries an
              # express-session without `secure` precisely so the checker has
              # something to mis-flag; "fixing" it defeats the fixture.
              - skill/mcp-migration-workspace/fixtures/**

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
